name: Publicar na Cloudflare
on:
  push:
    branches: [main, feat/home-demo-images]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verificar token de publicação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Cadastre CLOUDFLARE_API_TOKEN nos secrets do ambiente production do GitHub. Consulte docs/publicacao.md."
            exit 1
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2bc93c263c79b06b2a9d2540d4e7e3ee
          wranglerVersion: '4.45.0'
          command: deploy
