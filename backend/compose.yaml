name: personnallite-backend-dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: personnallite
      POSTGRES_USER: personnallite
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personnallite -d personnallite"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      CONTACT_INTAKE_ENABLED: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: personnallite
      POSTGRES_USER: personnallite
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_HOST: db
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"]
volumes:
  postgres_data:
