limit_req_zone $binary_remote_addr zone=clinic_login:10m rate=5r/m;
server {
    listen 80;
    server_name odontopersonnallite.com.br www.odontopersonnallite.com.br;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name odontopersonnallite.com.br www.odontopersonnallite.com.br;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/site;
    index index.html;
    client_max_body_size 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /tratamento-humanizado { return 301 /tratamento-humanizado/$is_args$args; }
    location /tratamento-humanizado/ { try_files $uri $uri/ =404; }
    location = /admin/login/ {
        limit_req zone=clinic_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Clinic-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/(api/|admin/|static/) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Clinic-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
